version: '3.8'

services:
  # ==========================================
  # MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: fuelstation-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MYSQL_DATABASE: ${DB_NAME:-fuelstation}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fuelstation_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-admin}"]
      timeout: 10s
      retries: 5

  # ==========================================
  # Spring Boot Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuelstation-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-fuelstation}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-admin}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
    ports:
      - "8080:8080"
    volumes:
      - backend_logs:/app/logs
      - backend_storage:/app/storage
    networks:
      - fuelstation_network

  # ==========================================
  # React Frontend (NGINX Reverse Proxy)
  # ==========================================
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: fuelstation-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - fuelstation_network

# ==========================================
# Volumes and Networks
# ==========================================
volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local
  backend_storage:
    driver: local

networks:
  fuelstation_network:
    driver: bridge
